<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardian — Live monitoring</title><link rel="stylesheet" href="styles.css"></head><body><main class="content"><div class="eyebrow">GUARDIAN / LIVE MONITORING</div><h1>GoldenGate & Kafka</h1><p>Read-only monitoring · <a href="demo.html">Open simulation demo</a></p><section class="panel lower"><form id="connect" class="setting-row"><label>Collector ID <input id="collector" value="default" pattern="[-\w]{1,64}" required></label><label>Read token <input id="token" type="password" required autocomplete="off"></label><button class="btn primary">Connect</button><button type="button" class="btn secondary" id="disconnect">Disconnect</button></form><p class="fineprint">The read token stays in memory for this tab. GoldenGate and Kafka credentials belong on the collector server.</p></section><p role="status" id="status" style="padding:20px 0">Not connected. Configure and start the collector first.</p><div id="metrics"></div></main><script type="module" src="live.js"></script></body></html>
